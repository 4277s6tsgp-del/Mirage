workflows:
  mirage-ipa:
    name: Mirage IPA
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
    scripts:
      - name: Build IPA
        script: |
          set -ex
          ./Scripts/fetch-xcframework.sh
          brew install xcodegen
          
          cat > project.yml << 'YML'
          name: MirageApp
          options:
            bundleIdPrefix: com.mirage
            xcodeVersion: "16.0"
          packages:
            Mirage:
              path: .
          targets:
            MirageApp:
              type: application
              platform: iOS
              deploymentTarget: "17.0"
              sources:
                - Examples/MirageExampleApp.swift
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.mirage.example
                  CODE_SIGNING_ALLOWED: NO
                  CODE_SIGNING_REQUIRED: NO
                  GENERATE_INFOPLIST_FILE: YES
              dependencies:
                - package: Mirage
          YML
          
          xcodegen generate
          ls -la
          
          xcodebuild -project MirageApp.xcodeproj -scheme MirageApp -sdk iphoneos -configuration Release CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO -derivedDataPath build/derivedData
          
          APP_PATH=$(find build/derivedData -name "*.app" -type d | head -n 1)
          echo "APP_PATH=$APP_PATH"
          ls -lh "$APP_PATH"
          
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          cd build
          zip -r MirageExampleApp.ipa Payload
          ls -lh
    artifacts:
      - build/*.ipa
