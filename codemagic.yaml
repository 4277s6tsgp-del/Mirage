workflows:
  mirage-ipa:
    name: Mirage IPA
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
    scripts:
      - name: Build unsigned IPA
        script: |
          cd Examples/MirageExampleApp || cd MirageExampleApp
          xcodebuild -project MirageExampleApp.xcodeproj -scheme MirageExampleApp -sdk iphoneos -configuration Release CODE_SIGNING_ALLOWED=NO -derivedDataPath ../../build/derivedData
          APP_PATH=$(find ../../build -name "*.app" | head -n 1)
          echo "App at $APP_PATH"
          mkdir -p ../../build/Payload
          cp -R "$APP_PATH" ../../build/Payload/
          cd ../../build
          zip -r MirageExampleApp.ipa Payload
    artifacts:
      - build/*.ipa
