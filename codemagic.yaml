workflows:
  mirage-ipa:
    name: Mirage IPA
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
    scripts:
      - name: Install xcodegen
        script: |
          brew install xcodegen
      - name: Create iOS app wrapper
        script: |
          ls -la Examples/
          cat > project.yml << 'YML'
          name: MirageApp
          options:
            bundleIdPrefix: com.mirage
            xcodeVersion: "16.0"
            generateEmptyDirectories: true
          packages:
            Mirage:
              path: .
          targets:
            MirageApp:
              type: application
              platform: iOS
              deploymentTarget: "17.0"
              sources:
                - Examples/MirageExampleApp.swift
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.mirage.example
                  CODE_SIGNING_ALLOWED: NO
                  INFOPLIST_FILE: ""
                  SWIFT_EMIT_LOC_STRINGS: NO
              dependencies:
                - package: Mirage
          YML
          cat project.yml
          xcodegen generate
          ls -la
      - name: Build unsigned IPA
        script: |
          ./Scripts/fetch-xcframework.sh || echo "fetch failed, continuing"
          xcodebuild -project MirageApp.xcodeproj -scheme MirageApp -sdk iphoneos -configuration Release CODE_SIGNING_ALLOWED=NO -derivedDataPath build/derivedData
          APP_PATH=$(find build/derivedData -name "*.app" -type d | head -n 1)
          echo "Found app: $APP_PATH"
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          cd build
          zip -r MirageExampleApp.ipa Payload
          ls -lh
    artifacts:
      - build/*.ipa
